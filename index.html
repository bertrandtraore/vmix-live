<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Live Video</title>

    <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        #status {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 10;
            color: white;
            background: rgba(0,0,0,.75);
            padding: 8px 14px;
            border-radius: 5px;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div id="status">Connecting...</div>

<video
    id="video"
    autoplay
    playsinline
    controls>
</video>

<script>

const LIVEKIT_URL =
    "wss://remote-video-wunzmsjv.livekit.cloud";

const ROOM_NAME =
    "vmix-live";

const TOKEN_SERVER_ID =
    "remotevideo-2zed8g";

const video =
    document.getElementById("video");

const status =
    document.getElementById("status");

let room = null;


// Create the development token source
const tokenSource =
    LivekitClient.TokenSource.developmentTokenServer(
        TOKEN_SERVER_ID
    );


// Connect to LiveKit
async function connectToLiveKit() {

    try {

        status.textContent = "Getting access token...";

        const tokenResponse =
            await tokenSource.fetch({
                roomName: ROOM_NAME
            });

        const serverUrl =
            tokenResponse.serverUrl;

        const participantToken =
            tokenResponse.participantToken;


        status.textContent =
            "Connecting to live stream...";


        room =
            new LivekitClient.Room({
                adaptiveStream: true,
                dynacast: true
            });


        // Video/audio tracks
        room.on(
            LivekitClient.RoomEvent.TrackSubscribed,
            (track, publication, participant) => {

                console.log(
                    "Track subscribed:",
                    track.kind,
                    participant.identity
                );


                if (
                    track.kind ===
                    LivekitClient.Track.Kind.Video
                ) {

                    track.attach(video);

                    status.textContent =
                        "LIVE";

                }


                if (
                    track.kind ===
                    LivekitClient.Track.Kind.Audio
                ) {

                    const audio =
                        track.attach();

                    audio.autoplay = true;

                    document.body.appendChild(audio);
                }
            }
        );


        // Track removed
        room.on(
            LivekitClient.RoomEvent.TrackUnsubscribed,
            (track) => {

                track.detach();

            }
        );


        // Disconnected
        room.on(
            LivekitClient.RoomEvent.Disconnected,
            () => {

                status.textContent =
                    "Disconnected";

            }
        );


        // Connect
        await room.connect(
            serverUrl,
            participantToken
        );


        status.textContent =
            "Connected — waiting for video...";


        console.log(
            "Connected to room:",
            ROOM_NAME
        );

    }

    catch (error) {

        console.error(error);

        status.textContent =
            "Connection failed";

    }

}


connectToLiveKit();

</script>

</body>
</html>
