<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Live Video</title>

    <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        #status {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 20;

            color: white;
            background: rgba(0, 0, 0, 0.75);

            padding: 8px 14px;
            border-radius: 5px;

            font-size: 14px;
        }

        /* Control container */
        #controls {
            position: fixed;
            bottom: 25px;
            right: 25px;

            z-index: 30;

            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Control buttons */
        .controlButton {
            width: 55px;
            height: 55px;

            border: none;
            border-radius: 50%;

            background: rgba(0, 0, 0, 0.75);
            color: white;

            font-size: 25px;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            transition:
                background 0.2s,
                transform 0.1s;
        }

        .controlButton:hover {
            background: rgba(40, 40, 40, 0.95);
        }

        .controlButton:active {
            transform: scale(0.92);
        }
    </style>
</head>

<body>

<!-- Status -->
<div id="status">Connecting...</div>

<!-- Live video -->
<video
    id="video"
    autoplay
    playsinline>
</video>


<!-- Controls -->
<div id="controls">

    <!-- Full screen -->
    <button
        id="fullscreenButton"
        class="controlButton"
        title="Full Screen">
        ⛶
    </button>

    <!-- Speaker -->
    <button
        id="speakerButton"
        class="controlButton"
        title="Mute">
        🔊
    </button>

</div>


<script>

const LIVEKIT_URL =
    "wss://remote-video-wunzmsjv.livekit.cloud";

const ROOM_NAME =
    "vmix-live";

const TOKEN_SERVER_ID =
    "remotevideo-2zed8g";


const video =
    document.getElementById("video");

const status =
    document.getElementById("status");

const speakerButton =
    document.getElementById("speakerButton");

const fullscreenButton =
    document.getElementById("fullscreenButton");


let room = null;

let audioElements = [];

let audioEnabled = true;


// ==================================================
// SPEAKER BUTTON
// ==================================================

speakerButton.addEventListener(
    "click",
    async () => {

        if (audioEnabled) {

            // Stop audio
            audioEnabled = false;

            audioElements.forEach(
                audio => {

                    audio.pause();

                }
            );

            video.muted = true;


            speakerButton.textContent =
                "🔇";

            speakerButton.title =
                "Unmute";

        }

        else {

            // Resume audio
            audioEnabled = true;

            video.muted = false;


            try {

                if (room) {
                    await room.startAudio();
                }

            } catch (error) {

                console.log(
                    "LiveKit audio:",
                    error
                );

            }


            for (
                const audio of audioElements
            ) {

                try {

                    await audio.play();

                } catch (error) {

                    console.log(
                        "Audio playback:",
                        error
                    );

                }

            }


            speakerButton.textContent =
                "🔊";

            speakerButton.title =
                "Mute";

        }

    }
);


// ==================================================
// FULL SCREEN BUTTON
// ==================================================

fullscreenButton.addEventListener(
    "click",
    async () => {

        try {

            // Enter fullscreen
            if (!document.fullscreenElement) {

                await document.documentElement.requestFullscreen();

                fullscreenButton.textContent =
                    "⛶";

                fullscreenButton.title =
                    "Exit Full Screen";

            }

            // Exit fullscreen
            else {

                await document.exitFullscreen();

                fullscreenButton.textContent =
                    "⛶";

                fullscreenButton.title =
                    "Full Screen";

            }

        }

        catch (error) {

            console.error(
                "Fullscreen error:",
                error
            );

        }

    }
);


// ==================================================
// UPDATE FULLSCREEN ICON
// ==================================================

document.addEventListener(
    "fullscreenchange",
    () => {

        if (document.fullscreenElement) {

            fullscreenButton.title =
                "Exit Full Screen";

        }

        else {

            fullscreenButton.title =
                "Full Screen";

        }

    }
);


// ==================================================
// CONNECT TO LIVEKIT
// ==================================================

async function connect() {

    try {

        status.textContent =
            "Connecting...";


        // Development Token Server
        const tokenSource =
            LivekitClient.TokenSource
                .developmentTokenServer(
                    TOKEN_SERVER_ID
                );


        const tokenResponse =
            await tokenSource.fetch({
                roomName: ROOM_NAME
            });


        // Create LiveKit room
        room =
            new LivekitClient.Room({
                adaptiveStream: true,
                dynacast: true
            });


        // ==================================================
        // TRACK SUBSCRIBED
        // ==================================================

        room.on(
            LivekitClient.RoomEvent.TrackSubscribed,

            (track, publication, participant) => {

                console.log(
                    "Track received:",
                    track.kind
                );


                // ------------------------------------------
                // VIDEO
                // ------------------------------------------

                if (
                    track.kind ===
                    LivekitClient.Track.Kind.Video
                ) {

                    track.attach(video);

                    video.autoplay = true;
                    video.playsInline = true;
                    video.controls = false;


                    status.textContent =
                        "LIVE";


                    video.play().catch(
                        error => {

                            console.log(
                                "Video playback:",
                                error
                            );

                        }
                    );

                }


                // ------------------------------------------
                // AUDIO
                // ------------------------------------------

                if (
                    track.kind ===
                    LivekitClient.Track.Kind.Audio
                ) {

                    console.log(
                        "AUDIO TRACK RECEIVED"
                    );


                    const audio =
                        track.attach();


                    audio.autoplay = true;
                    audio.controls = false;


                    document.body.appendChild(
                        audio
                    );


                    audioElements.push(
                        audio
                    );


                    if (audioEnabled) {

                        audio.play().catch(
                            error => {

                                console.log(
                                    "Audio autoplay blocked. Click 🔊.",
                                    error
                                );

                            }
                        );

                    }
                    else {

                        audio.pause();

                    }

                }

            }
        );


        // ==================================================
        // TRACK UNSUBSCRIBED
        // ==================================================

        room.on(
            LivekitClient.RoomEvent.TrackUnsubscribed,

            (track) => {

                track.detach();

            }
        );


        // ==================================================
        // DISCONNECTED
        // ==================================================

        room.on(
            LivekitClient.RoomEvent.Disconnected,

            () => {

                status.textContent =
                    "Disconnected";

            }
        );


        // ==================================================
        // CONNECT
        // ==================================================

        await room.connect(
            tokenResponse.serverUrl,
            tokenResponse.participantToken
        );


        status.textContent =
            "Connected — waiting for video...";


        console.log(
            "Connected to:",
            ROOM_NAME
        );

    }

    catch (error) {

        console.error(
            "Connection error:",
            error
        );


        status.textContent =
            "Connection failed";

    }

}


// ==================================================
// START
// ==================================================

connect();

</script>

</body>
</html>
