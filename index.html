<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Live Video</title>

    <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        /* ==============================
           VIDEO
        ============================== */

        #video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        /* ==============================
           STATUS
        ============================== */

        #status {
            position: fixed;
            top: 15px;
            left: 15px;

            z-index: 20;

            color: white;
            background: rgba(0, 0, 0, 0.75);

            padding: 8px 14px;

            border-radius: 5px;

            font-size: 14px;
        }

        /* ==============================
           CONTROLS
        ============================== */

        #controls {
            position: fixed;

            bottom: 25px;
            right: 25px;

            z-index: 30;

            display: flex;
            align-items: center;

            gap: 10px;
        }

        /* ==============================
           CONTROL BUTTON
        ============================== */

        .controlButton {
            width: 55px;
            height: 55px;

            border: none;
            border-radius: 50%;

            background: rgba(0, 0, 0, 0.75);

            color: white;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            transition:
                background 0.2s,
                transform 0.1s;
        }

        .controlButton:hover {
            background: rgba(45, 45, 45, 0.95);
        }

        .controlButton:active {
            transform: scale(0.92);
        }

        .controlButton svg {
            width: 25px;
            height: 25px;

            stroke: currentColor;

            fill: none;

            stroke-width: 2;

            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ==============================
           MOBILE
        ============================== */

        @media (max-width: 600px) {

            #controls {
                bottom: 15px;
                right: 15px;
            }

            .controlButton {
                width: 50px;
                height: 50px;
            }

            #status {
                top: 10px;
                left: 10px;

                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <!-- ==============================
         STATUS
    ============================== -->

    <div id="status">
        Connecting...
    </div>


    <!-- ==============================
         VIDEO
    ============================== -->

    <video
        id="video"
        autoplay
        playsinline>
    </video>


    <!-- ==============================
         CONTROLS
    ============================== -->

    <div id="controls">

        <!-- FULLSCREEN BUTTON -->

        <button
            id="fullscreenButton"
            class="controlButton"
            title="Full Screen"
            aria-label="Full Screen">

            <svg
                viewBox="0 0 24 24"
                aria-hidden="true">

                <path d="M8 3H5a2 2 0 0 0-2 2v3"></path>

                <path d="M16 3h3a2 2 0 0 1 2 2v3"></path>

                <path d="M8 21H5a2 2 0 0 1-2-2v-3"></path>

                <path d="M16 21h3a2 2 0 0 0 2-2v-3"></path>

            </svg>

        </button>


        <!-- SPEAKER BUTTON -->

        <button
            id="speakerButton"
            class="controlButton"
            title="Mute"
            aria-label="Mute">

            <svg
                id="speakerIcon"
                viewBox="0 0 24 24"
                aria-hidden="true">

                <polygon
                    points="11 5 6 9 2 9 2 15 6 15 11 19 11 5">
                </polygon>

                <path d="M15.5 8.5a5 5 0 0 1 0 7"></path>

                <path d="M19 5a10 10 0 0 1 0 14"></path>

            </svg>

        </button>

    </div>


<script>

/* ==================================================
   LIVEKIT CONFIGURATION
================================================== */

const LIVEKIT_URL =
    "wss://remote-video-wunzmsjv.livekit.cloud";

const ROOM_NAME =
    "vmix-live";

const TOKEN_SERVER_ID =
    "remotevideo-2zed8g";


/* ==================================================
   ELEMENTS
================================================== */

const video =
    document.getElementById("video");

const status =
    document.getElementById("status");

const speakerButton =
    document.getElementById("speakerButton");

const speakerIcon =
    document.getElementById("speakerIcon");

const fullscreenButton =
    document.getElementById("fullscreenButton");


/* ==================================================
   VARIABLES
================================================== */

let room = null;

let audioElements = [];

let audioEnabled = true;


/* ==================================================
   SPEAKER ICON
================================================== */

function setSpeakerIcon(muted) {

    if (muted) {

        speakerIcon.innerHTML = `
            <polygon
                points="11 5 6 9 2 9 2 15 6 15 11 19 11 5">
            </polygon>

            <line
                x1="16"
                y1="9"
                x2="21"
                y2="15">
            </line>

            <line
                x1="21"
                y1="9"
                x2="16"
                y2="15">
            </line>
        `;

        speakerButton.title =
            "Unmute";

        speakerButton.setAttribute(
            "aria-label",
            "Unmute"
        );

    }

    else {

        speakerIcon.innerHTML = `
            <polygon
                points="11 5 6 9 2 9 2 15 6 15 11 19 11 5">
            </polygon>

            <path
                d="M15.5 8.5a5 5 0 0 1 0 7">
            </path>

            <path
                d="M19 5a10 10 0 0 1 0 14">
            </path>
        `;

        speakerButton.title =
            "Mute";

        speakerButton.setAttribute(
            "aria-label",
            "Mute"
        );

    }

}


/* ==================================================
   SPEAKER BUTTON
================================================== */

speakerButton.addEventListener(
    "click",
    async () => {

        if (audioEnabled) {

            /* ==============================
               MUTE
            ============================== */

            audioEnabled = false;

            video.muted = true;


            audioElements.forEach(
                audio => {

                    audio.pause();

                }
            );


            setSpeakerIcon(true);

        }

        else {

            /* ==============================
               UNMUTE
            ============================== */

            audioEnabled = true;

            video.muted = false;


            try {

                if (room) {

                    await room.startAudio();

                }

            }

            catch (error) {

                console.log(
                    "LiveKit audio:",
                    error
                );

            }


            for (
                const audio of audioElements
            ) {

                try {

                    await audio.play();

                }

                catch (error) {

                    console.log(
                        "Audio playback:",
                        error
                    );

                }

            }


            setSpeakerIcon(false);

        }

    }
);


/* ==================================================
   FULLSCREEN BUTTON
================================================== */

fullscreenButton.addEventListener(
    "click",
    async () => {

        try {

            if (!document.fullscreenElement) {

                await document.documentElement.requestFullscreen();

            }

            else {

                await document.exitFullscreen();

            }

        }

        catch (error) {

            console.error(
                "Fullscreen error:",
                error
            );

        }

    }
);


/* ==================================================
   FULLSCREEN STATE
================================================== */

document.addEventListener(
    "fullscreenchange",
    () => {

        if (document.fullscreenElement) {

            fullscreenButton.title =
                "Exit Full Screen";

            fullscreenButton.setAttribute(
                "aria-label",
                "Exit Full Screen"
            );

        }

        else {

            fullscreenButton.title =
                "Full Screen";

            fullscreenButton.setAttribute(
                "aria-label",
                "Full Screen"
            );

        }

    }
);


/* ==================================================
   CONNECT TO LIVEKIT
================================================== */

async function connect() {

    try {

        status.textContent =
            "Connecting...";


        /* ==============================
           DEVELOPMENT TOKEN SERVER
        ============================== */

        const tokenSource =
            LivekitClient.TokenSource
                .developmentTokenServer(
                    TOKEN_SERVER_ID
                );


        const tokenResponse =
            await tokenSource.fetch({
                roomName: ROOM_NAME
            });


        /* ==============================
           CREATE ROOM
        ============================== */

        room =
            new LivekitClient.Room({

                adaptiveStream: true,

                dynacast: true

            });


        /* ==================================================
           TRACK SUBSCRIBED
        ================================================== */

        room.on(
            LivekitClient.RoomEvent.TrackSubscribed,

            (track, publication, participant) => {

                console.log(
                    "Track received:",
                    track.kind
                );


                /* ==============================
                   VIDEO
                ============================== */

                if (
                    track.kind ===
                    LivekitClient.Track.Kind.Video
                ) {

                    track.attach(video);


                    video.autoplay =
                        true;

                    video.playsInline =
                        true;

                    video.controls =
                        false;


                    status.textContent =
                        "LIVE";


                    video.play().catch(
                        error => {

                            console.log(
                                "Video playback:",
                                error
                            );

                        }
                    );

                }


                /* ==============================
                   AUDIO
                ============================== */

                if (
                    track.kind ===
                    LivekitClient.Track.Kind.Audio
                ) {

                    console.log(
                        "AUDIO TRACK RECEIVED"
                    );


                    const audio =
                        track.attach();


                    audio.autoplay =
                        true;

                    audio.controls =
                        false;


                    document.body.appendChild(
                        audio
                    );


                    audioElements.push(
                        audio
                    );


                    if (audioEnabled) {

                        audio.play().catch(
                            error => {

                                console.log(
                                    "Audio autoplay blocked. Click speaker.",
                                    error
                                );

                            }
                        );

                    }

                    else {

                        audio.pause();

                    }

                }

            }
        );


        /* ==================================================
           TRACK UNSUBSCRIBED
        ================================================== */

        room.on(
            LivekitClient.RoomEvent.TrackUnsubscribed,

            (track) => {

                track.detach();

            }
        );


        /* ==================================================
           DISCONNECTED
        ================================================== */

        room.on(
            LivekitClient.RoomEvent.Disconnected,

            () => {

                status.textContent =
                    "Disconnected";

            }
        );


        /* ==================================================
           CONNECT
        ================================================== */

        await room.connect(
            tokenResponse.serverUrl,
            tokenResponse.participantToken
        );


        status.textContent =
            "Connected — waiting for video...";


        console.log(
            "Connected to:",
            ROOM_NAME
        );

    }

    catch (error) {

        console.error(
            "Connection error:",
            error
        );


        status.textContent =
            "Connection failed";

    }

}


/* ==================================================
   START
================================================== */

setSpeakerIcon(false);

connect();

</script>

</body>
</html>
