<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Video</title>

    <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        #status {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 10;
            color: white;
            background: rgba(0,0,0,.75);
            padding: 8px 14px;
            border-radius: 5px;
        }

        #unmute {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div id="status">Connecting...</div>

<video id="video" autoplay playsinline controls></video>

<button id="unmute">🔊 Enable Audio</button>

<script>

const LIVEKIT_URL =
    "wss://remote-video-wunzmsjv.livekit.cloud";

const ROOM_NAME =
    "vmix-live";

const TOKEN_SERVER_ID =
    "remotevideo-2zed8g";

const video =
    document.getElementById("video");

const status =
    document.getElementById("status");

const unmute =
    document.getElementById("unmute");

let room;


// Enable browser audio
unmute.onclick = async function () {

    try {

        video.muted = false;

        await video.play();

        // Resume Web Audio if required
        if (room) {
            await room.startAudio();
        }

        unmute.style.display = "none";

    } catch (error) {

        console.error("Audio enable error:", error);

    }

};


async function connect() {

    try {

        status.textContent =
            "Getting access token...";


        const tokenSource =
            LivekitClient.TokenSource
                .developmentTokenServer(
                    TOKEN_SERVER_ID
                );


        const tokenResponse =
            await tokenSource.fetch({
                roomName: ROOM_NAME
            });


        room =
            new LivekitClient.Room({
                adaptiveStream: true,
                dynacast: true
            });


        room.on(
            LivekitClient.RoomEvent.TrackSubscribed,
            (track, publication, participant) => {

                console.log(
                    "Track:",
                    track.kind,
                    participant.identity
                );


                // VIDEO
                if (
                    track.kind ===
                    LivekitClient.Track.Kind.Video
                ) {

                    track.attach(video);

                    status.textContent =
                        "LIVE";

                }


                // AUDIO
                if (
                    track.kind ===
                    LivekitClient.Track.Kind.Audio
                ) {

                    console.log("AUDIO TRACK RECEIVED");

                    const audio =
                        track.attach();

                    audio.autoplay = true;
                    audio.controls = false;

                    document.body.appendChild(audio);

                    audio.play().catch(
                        error => {
                            console.log(
                                "Browser blocked autoplay:",
                                error
                            );
                        }
                    );
                }

            }
        );


        room.on(
            LivekitClient.RoomEvent.TrackUnsubscribed,
            (track) => {

                track.detach();

            }
        );


        room.on(
            LivekitClient.RoomEvent.Disconnected,
            () => {

                status.textContent =
                    "Disconnected";

            }
        );


        await room.connect(
            tokenResponse.serverUrl,
            tokenResponse.participantToken
        );


        status.textContent =
            "Connected — waiting for video...";


        // Ask LiveKit to start audio
        try {
            await room.startAudio();
        } catch (e) {
            console.log("Audio requires user interaction");
        }

    }

    catch (error) {

        console.error(error);

        status.textContent =
            "Connection failed";

    }

}


connect();

</script>

</body>
</html>
