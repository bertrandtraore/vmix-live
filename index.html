<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Live Video</title>

    <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            background: #000;

            overflow: hidden;

            font-family: Arial, sans-serif;
        }

        #video {
            position: fixed;

            top: 0;
            left: 0;

            width: 100vw;
            height: 100vh;

            width: 100dvw;
            height: 100dvh;

            object-fit: contain;

            background: #000;

            display: block;
        }

        #status {
            position: fixed;

            top: 15px;
            left: 15px;

            z-index: 20;

            color: white;

            background: rgba(0, 0, 0, 0.75);

            padding: 8px 14px;

            border-radius: 5px;

            font-size: 14px;
        }

        #controls {
            position: fixed;

            bottom: 25px;
            right: 25px;

            z-index: 30;

            display: flex;

            align-items: center;

            gap: 10px;

            padding-bottom: env(
                safe-area-inset-bottom,
                0px
            );
        }

        .controlButton {
            width: 55px;
            height: 55px;

            padding: 0;

            border: none;

            border-radius: 50%;

            background: rgba(0, 0, 0, 0.75);

            color: white;

            cursor: pointer;

            display: flex;

            align-items: center;
            justify-content: center;

            -webkit-tap-highlight-color: transparent;

            transition:
                background 0.2s ease,
                transform 0.1s ease;
        }

        .controlButton:hover {
            background: rgba(45, 45, 45, 0.95);
        }

        .controlButton:active {
            transform: scale(0.92);
        }

        .controlButton svg {
            width: 25px;
            height: 25px;

            stroke: currentColor;

            fill: none;

            stroke-width: 2;

            stroke-linecap: round;
            stroke-linejoin: round;
        }

        @media (max-width: 600px) {

            #controls {
                right: 15px;
                bottom: 15px;
            }

            .controlButton {
                width: 50px;
                height: 50px;
            }

            #status {
                top: 10px;
                left: 10px;

                font-size: 12px;
            }

        }

        :fullscreen {
            background: #000;
        }

        :-webkit-full-screen {
            background: #000;
        }

        @media (orientation: landscape) {

            #video {
                width: 100vw;
                height: 100vh;

                width: 100dvw;
                height: 100dvh;
            }

        }

    </style>

</head>

<body>


    <!-- STATUS -->

    <div id="status">
        Connecting...
    </div>


    <!-- VIDEO -->

    <video
        id="video"
        autoplay
        playsinline
        webkit-playsinline>
    </video>


    <!-- CONTROLS -->

    <div id="controls">


        <!-- FULLSCREEN -->

        <button
            id="fullscreenButton"
            class="controlButton"
            title="Full Screen"
            aria-label="Full Screen">

            <svg
                id="fullscreenIcon"
                viewBox="0 0 24 24"
                aria-hidden="true">

                <path d="M8 3H5a2 2 0 0 0-2 2v3"></path>

                <path d="M16 3h3a2 2 0 0 1 2 2v3"></path>

                <path d="M8 21H5a2 2 0 0 1-2-2v-3"></path>

                <path d="M16 21h3a2 2 0 0 0 2-2v-3"></path>

            </svg>

        </button>


        <!-- SPEAKER -->

        <button
            id="speakerButton"
            class="controlButton"
            title="Mute"
            aria-label="Mute">

            <svg
                id="speakerIcon"
                viewBox="0 0 24 24"
                aria-hidden="true">

                <polygon
                    points="11 5 6 9 2 9 2 15 6 15 11 19 11 5">
                </polygon>

                <path
                    d="M15.5 8.5a5 5 0 0 1 0 7">
                </path>

                <path
                    d="M19 5a10 10 0 0 1 0 14">
                </path>

            </svg>

        </button>

    </div>


<script>

/* ==================================================
   LIVEKIT CONFIGURATION
================================================== */

const LIVEKIT_URL =
    "wss://remote-video-wunzmsjv.livekit.cloud";

const ROOM_NAME =
    "vmix-live";

const TOKEN_SERVER_ID =
    "remotevideo-2zed8g";


/* ==================================================
   ELEMENTS
================================================== */

const video =
    document.getElementById("video");

const status =
    document.getElementById("status");

const speakerButton =
    document.getElementById("speakerButton");

const speakerIcon =
    document.getElementById("speakerIcon");

const fullscreenButton =
    document.getElementById("fullscreenButton");

const fullscreenIcon =
    document.getElementById("fullscreenIcon");


/* ==================================================
   VARIABLES
================================================== */

let room = null;

let audioElements = [];

let audioEnabled = true;


/*
 * RECONNECT SETTINGS
 */

let reconnectTimer = null;

let reconnectAttempt = 0;

const RECONNECT_DELAY = 5000;


/* ==================================================
   SPEAKER ICON
================================================== */

function setSpeakerIcon(muted) {

    if (muted) {

        speakerIcon.innerHTML = `

            <polygon
                points="11 5 6 9 2 9 2 15 6 15 11 19 11 5">
            </polygon>

            <line
                x1="16"
                y1="9"
                x2="21"
                y2="15">
            </line>

            <line
                x1="21"
                y1="9"
                x2="16"
                y2="15">
            </line>

        `;

        speakerButton.title =
            "Unmute";

        speakerButton.setAttribute(
            "aria-label",
            "Unmute"
        );

    }

    else {

        speakerIcon.innerHTML = `

            <polygon
                points="11 5 6 9 2 9 2 15 6 15 11 19 11 5">
            </polygon>

            <path
                d="M15.5 8.5a5 5 0 0 1 0 7">
            </path>

            <path
                d="M19 5a10 10 0 0 1 0 14">
            </path>

        `;

        speakerButton.title =
            "Mute";

        speakerButton.setAttribute(
            "aria-label",
            "Mute"
        );

    }

}


/* ==================================================
   FULLSCREEN ICON
================================================== */

function setFullscreenIcon(isFullscreen) {

    if (isFullscreen) {

        fullscreenIcon.innerHTML = `

            <path d="M9 3v5H4"></path>

            <path d="M15 3v5h5"></path>

            <path d="M9 21v-5H4"></path>

            <path d="M15 21v-5h5"></path>

        `;

        fullscreenButton.title =
            "Exit Full Screen";

        fullscreenButton.setAttribute(
            "aria-label",
            "Exit Full Screen"
        );

    }

    else {

        fullscreenIcon.innerHTML = `

            <path d="M8 3H5a2 2 0 0 0-2 2v3"></path>

            <path d="M16 3h3a2 2 0 0 1 2 2v3"></path>

            <path d="M8 21H5a2 2 0 0 1-2-2v-3"></path>

            <path d="M16 21h3a2 2 0 0 0 2-2v-3"></path>

        `;

        fullscreenButton.title =
            "Full Screen";

        fullscreenButton.setAttribute(
            "aria-label",
            "Full Screen"
        );

    }

}


/* ==================================================
   SPEAKER BUTTON
================================================== */

speakerButton.addEventListener(
    "click",
    async () => {

        if (audioEnabled) {

            audioEnabled = false;

            video.muted = true;

            audioElements.forEach(
                audio => {
                    audio.pause();
                }
            );

            setSpeakerIcon(true);

        }

        else {

            audioEnabled = true;

            video.muted = false;

            try {

                if (room) {
                    await room.startAudio();
                }

            }

            catch (error) {

                console.log(
                    "LiveKit audio:",
                    error
                );

            }

            for (
                const audio of audioElements
            ) {

                try {

                    await audio.play();

                }

                catch (error) {

                    console.log(
                        "Audio playback:",
                        error
                    );

                }

            }

            setSpeakerIcon(false);

        }

    }
);


/* ==================================================
   LANDSCAPE
================================================== */

async function enterLandscape() {

    if (
        screen.orientation &&
        screen.orientation.lock
    ) {

        try {

            await screen.orientation.lock(
                "landscape"
            );

        }

        catch (error) {

            console.log(
                "Landscape orientation could not be locked:",
                error
            );

        }

    }

}


/* ==================================================
   UNLOCK ORIENTATION
================================================== */

function unlockOrientation() {

    if (
        screen.orientation &&
        screen.orientation.unlock
    ) {

        try {

            screen.orientation.unlock();

        }

        catch (error) {

            console.log(
                "Orientation unlock error:",
                error
            );

        }

    }

}


/* ==================================================
   ENTER FULLSCREEN
================================================== */

async function enterFullscreen() {

    try {

        if (
            document.documentElement.requestFullscreen
        ) {

            await document.documentElement
                .requestFullscreen();

        }

        else if (
            document.documentElement.webkitRequestFullscreen
        ) {

            document.documentElement
                .webkitRequestFullscreen();

        }


        await new Promise(
            resolve =>
                setTimeout(resolve, 150)
        );


        await enterLandscape();

        setFullscreenIcon(true);

    }

    catch (error) {

        console.error(
            "Fullscreen error:",
            error
        );

    }

}


/* ==================================================
   EXIT FULLSCREEN
================================================== */

async function exitFullscreen() {

    try {

        unlockOrientation();

        if (
            document.exitFullscreen
        ) {

            await document.exitFullscreen();

        }

        else if (
            document.webkitExitFullscreen
        ) {

            document.webkitExitFullscreen();

        }

        setFullscreenIcon(false);

    }

    catch (error) {

        console.error(
            "Exit fullscreen error:",
            error
        );

    }

}


/* ==================================================
   FULLSCREEN BUTTON
================================================== */

fullscreenButton.addEventListener(
    "click",
    async () => {

        if (!document.fullscreenElement) {

            await enterFullscreen();

        }

        else {

            await exitFullscreen();

        }

    }
);


/* ==================================================
   FULLSCREEN CHANGE
================================================== */

document.addEventListener(
    "fullscreenchange",
    () => {

        if (document.fullscreenElement) {

            setFullscreenIcon(true);

        }

        else {

            setFullscreenIcon(false);

            unlockOrientation();

        }

    }
);


/* ==================================================
   AUTOMATIC RECONNECT
================================================== */

function scheduleReconnect() {

    /*
     * Prevent multiple reconnect timers.
     */

    if (reconnectTimer) {
        return;
    }


    reconnectAttempt++;


    status.textContent =
        "Connection lost — reconnecting...";


    reconnectTimer =
        setTimeout(
            async () => {

                reconnectTimer = null;

                await connect();

            },
            RECONNECT_DELAY
        );

}


/* ==================================================
   CONNECT TO LIVEKIT
================================================== */

async function connect() {

    try {

        status.textContent =
            "Connecting...";


        /*
         * Clean up previous room.
         */

        if (room) {

            try {

                room.removeAllListeners();

                await room.disconnect();

            }

            catch (error) {

                console.log(
                    "Previous room cleanup:",
                    error
                );

            }

        }


        /*
         * Remove old audio elements.
         */

        audioElements.forEach(
            audio => {

                try {
                    audio.pause();
                }
                catch {}

                audio.remove();

            }
        );


        audioElements = [];


        /* ==================================================
           TOKEN SERVER
        ================================================== */

        const tokenSource =
            LivekitClient.TokenSource
                .developmentTokenServer(
                    TOKEN_SERVER_ID
                );


        const tokenResponse =
            await tokenSource.fetch({

                roomName:
                    ROOM_NAME

            });


        /* ==================================================
           CREATE ROOM
        ================================================== */

        room =
            new LivekitClient.Room({

                adaptiveStream:
                    true,

                dynacast:
                    true

            });


        /* ==================================================
           TRACK SUBSCRIBED
        ================================================== */

        room.on(

            LivekitClient.RoomEvent.TrackSubscribed,

            (
                track,
                publication,
                participant
            ) => {

                console.log(
                    "Track received:",
                    track.kind
                );


                /* ==============================
                   VIDEO
                ============================== */

                if (
                    track.kind ===
                    LivekitClient.Track.Kind.Video
                ) {

                    track.attach(
                        video
                    );


                    video.autoplay =
                        true;

                    video.playsInline =
                        true;

                    video.controls =
                        false;


                    status.textContent =
                        "LIVE";


                    reconnectAttempt = 0;


                    video.play().catch(
                        error => {

                            console.log(
                                "Video playback:",
                                error
                            );

                        }
                    );

                }


                /* ==============================
                   AUDIO
                ============================== */

                if (
                    track.kind ===
                    LivekitClient.Track.Kind.Audio
                ) {

                    console.log(
                        "AUDIO TRACK RECEIVED"
                    );


                    const audio =
                        track.attach();


                    audio.autoplay =
                        true;

                    audio.controls =
                        false;


                    document.body.appendChild(
                        audio
                    );


                    audioElements.push(
                        audio
                    );


                    if (audioEnabled) {

                        audio.play().catch(
                            error => {

                                console.log(
                                    "Audio autoplay blocked. Click speaker.",
                                    error
                                );

                            }
                        );

                    }

                    else {

                        audio.pause();

                    }

                }

            }

        );


        /* ==================================================
           TRACK UNSUBSCRIBED
        ================================================== */

        room.on(

            LivekitClient.RoomEvent.TrackUnsubscribed,

            track => {

                track.detach();

            }

        );


        /* ==================================================
           DISCONNECTED
        ================================================== */

        room.on(

            LivekitClient.RoomEvent.Disconnected,

            () => {

                console.log(
                    "LiveKit disconnected"
                );


                status.textContent =
                    "Connection lost — reconnecting...";


                scheduleReconnect();

            }

        );


        /* ==================================================
           CONNECT
        ================================================== */

        await room.connect(

            tokenResponse.serverUrl,

            tokenResponse.participantToken

        );


        console.log(
            "Connected to:",
            ROOM_NAME
        );


        /*
         * Connection established.
         */

        reconnectAttempt = 0;


        status.textContent =
            "Connected — waiting for video...";


    }

    catch (error) {

        console.error(
            "Connection error:",
            error
        );


        status.textContent =
            "Connection lost — reconnecting...";


        /*
         * Automatically try again.
         */

        scheduleReconnect();

    }

}


/* ==================================================
   INITIALIZE
================================================== */

setSpeakerIcon(false);

setFullscreenIcon(false);

connect();

</script>

</body>
</html>
