<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Live Video</title>

    <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        #status {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 20;
            color: white;
            background: rgba(0, 0, 0, 0.75);
            padding: 8px 14px;
            border-radius: 5px;
            font-size: 14px;
        }

        #speakerButton {
            position: fixed;
            bottom: 25px;
            right: 25px;
            z-index: 30;

            width: 55px;
            height: 55px;

            border: none;
            border-radius: 50%;

            background: rgba(0, 0, 0, 0.75);
            color: white;

            font-size: 25px;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            transition: background 0.2s, transform 0.1s;
        }

        #speakerButton:hover {
            background: rgba(40, 40, 40, 0.95);
        }

        #speakerButton:active {
            transform: scale(0.92);
        }
    </style>
</head>

<body>

<div id="status">Connecting...</div>

<!-- Live video only — no play/pause controls -->
<video
    id="video"
    autoplay
    playsinline>
</video>

<!-- Speaker control -->
<button
    id="speakerButton"
    title="Mute">
    🔊
</button>


<script>

const LIVEKIT_URL =
    "wss://remote-video-wunzmsjv.livekit.cloud";

const ROOM_NAME =
    "vmix-live";

const TOKEN_SERVER_ID =
    "remotevideo-2zed8g";


const video =
    document.getElementById("video");

const status =
    document.getElementById("status");

const speakerButton =
    document.getElementById("speakerButton");


let room = null;

let audioElements = [];

let audioPlaying = true;


// --------------------------------------------------
// SPEAKER BUTTON
// --------------------------------------------------

speakerButton.addEventListener("click", async () => {

    if (audioPlaying) {

        // ------------------------------------------
        // STOP AUDIO
        // ------------------------------------------

        audioPlaying = false;

        audioElements.forEach(audio => {

            audio.pause();

            audio.currentTime = 0;

        });

        // Also mute the video element
        video.muted = true;


        speakerButton.textContent = "🔇";

        speakerButton.title = "Unmute";

    } else {

        // ------------------------------------------
        // RESUME AUDIO
        // ------------------------------------------

        audioPlaying = true;

        video.muted = false;


        for (const audio of audioElements) {

            try {

                await audio.play();

            } catch (error) {

                console.log(
                    "Unable to resume audio:",
                    error
                );

            }

        }


        try {

            if (room) {
                await room.startAudio();
            }

        } catch (error) {

            console.log(
                "LiveKit audio:",
                error
            );

        }


        speakerButton.textContent = "🔊";

        speakerButton.title = "Mute";

    }

});


// --------------------------------------------------
// CONNECT TO LIVEKIT
// --------------------------------------------------

async function connect() {

    try {

        status.textContent =
            "Getting access token...";


        // Development Token Server
        const tokenSource =
            LivekitClient.TokenSource
                .developmentTokenServer(
                    TOKEN_SERVER_ID
                );


        const tokenResponse =
            await tokenSource.fetch({
                roomName: ROOM_NAME
            });


        // Create LiveKit room
        room =
            new LivekitClient.Room({
                adaptiveStream: true,
                dynacast: true
            });


        // --------------------------------------------------
        // TRACK SUBSCRIBED
        // --------------------------------------------------

        room.on(
            LivekitClient.RoomEvent.TrackSubscribed,

            (track, publication, participant) => {

                console.log(
                    "Track received:",
                    track.kind
                );


                // ------------------------------------------
                // VIDEO
                // ------------------------------------------

                if (
                    track.kind ===
                    LivekitClient.Track.Kind.Video
                ) {

                    track.attach(video);

                    video.autoplay = true;

                    video.playsInline = true;

                    video.controls = false;

                    video.muted = false;


                    status.textContent =
                        "LIVE";


                    video.play().catch(
                        error => {

                            console.log(
                                "Video autoplay:",
                                error
                            );

                        }
                    );

                }


                // ------------------------------------------
                // AUDIO
                // ------------------------------------------

                if (
                    track.kind ===
                    LivekitClient.Track.Kind.Audio
                ) {

                    console.log(
                        "AUDIO TRACK RECEIVED"
                    );


                    const audio =
                        track.attach();


                    audio.autoplay = true;

                    audio.controls = false;

                    audio.muted = false;


                    document.body.appendChild(
                        audio
                    );


                    audioElements.push(
                        audio
                    );


                    // Play only if speaker is ON
                    if (audioPlaying) {

                        audio.play().catch(
                            error => {

                                console.log(
                                    "Audio autoplay blocked:",
                                    error
                                );

                            }
                        );

                    } else {

                        audio.pause();

                    }

                }

            }
        );


        // --------------------------------------------------
        // TRACK UNSUBSCRIBED
        // --------------------------------------------------

        room.on(
            LivekitClient.RoomEvent.TrackUnsubscribed,

            (track) => {

                track.detach();

            }
        );


        // --------------------------------------------------
        // DISCONNECTED
        // --------------------------------------------------

        room.on(
            LivekitClient.RoomEvent.Disconnected,

            () => {

                status.textContent =
                    "Disconnected";

            }
        );


        // --------------------------------------------------
        // CONNECT
        // --------------------------------------------------

        await room.connect(
            tokenResponse.serverUrl,
            tokenResponse.participantToken
        );


        status.textContent =
            "Connected — waiting for video...";


        console.log(
            "Connected to room:",
            ROOM_NAME
        );

    }

    catch (error) {

        console.error(error);

        status.textContent =
            "Connection failed";

    }

}

connect();

</script>

</body>
</html>
